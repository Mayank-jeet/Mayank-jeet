  <g filter="url(#m-shadow)">
    <circle cx="14" cy="14" r="12" fill="url(#m-rim)"/>
    <circle cx="14" cy="14" r="9" fill="url(#m-well)"/>
    <ellipse cx="14" cy="9.4" rx="7.4" ry="4.3" fill="url(#m-gloss)"/>
