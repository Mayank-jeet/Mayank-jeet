<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="216" viewBox="0 0 900 216" role="img"><title>About me</title>
<style>text{font-family:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',Consolas,'DejaVu Sans Mono',monospace}</style>
<rect x="0.5" y="0.5" width="899" height="215" rx="6" fill="#212830" stroke="#3d444d"/><g transform="translate(24 31) scale(0.85)" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></g><text x="58" y="46" font-size="13" fill="#c9d1d9" xml:space="preserve">B.Tech student at <tspan font-weight="700" fill="#f0f6fc">IIT Bhubaneswar</tspan>, spending most of my time building software.</text><g transform="translate(24 67) scale(0.85)" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g><text x="58" y="82" font-size="13" fill="#c9d1d9" xml:space="preserve">I take ideas from model to API to UI to live deployment, using LangGraph, FastAPI, React and PyTorch.</text><g transform="translate(24 103) scale(0.85)" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M11 7l-4 9M13 7l4 9"/></g><text x="58" y="118" font-size="13" fill="#c9d1d9" xml:space="preserve"><tspan font-weight="700" fill="#f0f6fc">600+ DSA problems</tspan> solved in C++ on LeetCode and CodeForces.</text><g transform="translate(24 139) scale(0.85)" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3"/><path d="M12 14v4M8 21h8M9 18h6"/></g><text x="58" y="154" font-size="13" fill="#c9d1d9" xml:space="preserve">Core Head of Sports Fest at IIT Bhubaneswar, leading a team of organizers.</text><g transform="translate(24 175) scale(0.85)" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></g><text x="58" y="190" font-size="13" fill="#c9d1d9" xml:space="preserve"><tspan font-weight="700" fill="#f0f6fc">Open to</tspan> AI Engineer, ML Engineer, Data Scientist and SDE (ML) roles.</text>
